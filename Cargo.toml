[package]
name = "npyz-viewer"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Masanori AKIMOTO <masanori.akimoto.ac@gmail.com>"]
description = "A fast Tauri viewer for NumPy .npy/.npz files"
readme = "README.md"
autobins = false

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
rfd = { version = "0.15.4", default-features = false, features = ["gtk3"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.11.5", default-features = false, features = ["wry", "x11"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate-flate2", "flate2"] }

[dev-dependencies]
ndarray = "0.16.1"
ndarray-npy = "0.9.1"

[[bin]]
name = "npyz-viewer"
path = "src/app.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
